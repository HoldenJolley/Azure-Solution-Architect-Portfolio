name: e-commerce validation destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Validation environment to destroy
        required: true
        default: dev
        type: choice
        options:
          - dev
      confirm_destroy:
        description: 'Enter DESTROY-ECOMMERCE-dev to confirm permanent teardown of the validation stack'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: ecommerce-live-validation-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Confirm intentional teardown
        shell: pwsh
        run: |
          $expected = 'DESTROY-ECOMMERCE-${{ inputs.environment }}'
          if ('${{ inputs.confirm_destroy }}' -ne $expected) {
            throw "Destroy confirmation did not match '$expected'."
          }

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Deployment Stack and managed resources
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/destroy.ps1 -Environment ${{ inputs.environment }} -Force -EvidenceDirectory "_evidence/ecommerce-${{ inputs.environment }}-cleanup"

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-${{ inputs.environment }}-cleanup-evidence
          path: _evidence/ecommerce-${{ inputs.environment }}-cleanup
          if-no-files-found: warn
          retention-days: 30
