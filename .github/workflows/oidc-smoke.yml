name: OIDC smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/oidc-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oidc-smoke.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pull-request-subject:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure account is enabled
        shell: bash
        run: test "$(az account show --query state -o tsv)" = "Enabled"

  dev-environment-subject:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure account is enabled
        shell: bash
        run: test "$(az account show --query state -o tsv)" = "Enabled"

  test-environment-subject:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure account is enabled
        shell: bash
        run: test "$(az account show --query state -o tsv)" = "Enabled"

  prod-environment-subject:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure account is enabled
        shell: bash
        run: test "$(az account show --query state -o tsv)" = "Enabled"

  main-branch-subject:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure account is enabled
        shell: bash
        run: test "$(az account show --query state -o tsv)" = "Enabled"
