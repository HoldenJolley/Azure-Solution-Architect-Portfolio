name: resume build

on:
  push:
    branches:
      - main
      - feature/cost-optimized-static-portfolio
    paths:
      - 'resume-source.json'
      - 'tools/build_resume.py'
      - '.github/workflows/resume-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install PDF build dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir reportlab==4.4.9 pypdf==5.9.0

      - name: Build resume
        run: python3 tools/build_resume.py --source resume-source.json --output resume.pdf

      - name: Verify resume
        shell: bash
        run: |
          python3 - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader('resume.pdf')
          if len(reader.pages) != 2:
              raise SystemExit(f'Expected a 2-page resume, got {len(reader.pages)} pages')
          text = '\n'.join((page.extract_text() or '') for page in reader.pages)
          normalized = text.casefold()
          required = [
              'Selected Azure Architecture Projects',
              'Azure E-Commerce Reference Architecture',
              'Privacy-Preserving AI Age Assurance Platform',
              'Cost-Optimized Azure Static Portfolio',
              'University of North Carolina at Pembroke',
          ]
          missing = [item for item in required if item.casefold() not in normalized]
          if missing:
              raise SystemExit(f'Missing expected resume content: {missing}')
          print('Resume verification passed: 2 pages and required sections present.')
          PY

      - name: Commit generated PDF
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resume.pdf
          if git diff --cached --quiet; then
            echo 'resume.pdf is already up to date.'
            exit 0
          fi
          git commit -m 'docs: regenerate resume PDF'
          git push
