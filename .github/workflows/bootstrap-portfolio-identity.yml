name: bootstrap portfolio deployment identity

on:
  push:
    branches: [bootstrap-portfolio-managed-identity]
    paths:
      - 'projects/resume/platform/infra/bootstrap/**'
      - '.github/workflows/bootstrap-portfolio-identity.yml'

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login with existing OIDC identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate bootstrap template
        shell: bash
        env:
          GITHUB_FEDERATED_SUBJECT: repo:HoldenJolley@323807497/Azure-Soltuion-Architect-Portfolio@1354100347:environment:prod
        run: |
          set -euo pipefail
          az bicep lint --file projects/resume/platform/infra/bootstrap/bootstrap-identity.bicep
          az bicep build --file projects/resume/platform/infra/bootstrap/bootstrap-identity.bicep --stdout >/dev/null
          az deployment sub what-if \
            --name portfolio-identity-bootstrap-preflight \
            --location eastus2 \
            --template-file projects/resume/platform/infra/bootstrap/bootstrap-identity.bicep \
            --parameters githubSubject="$GITHUB_FEDERATED_SUBJECT" \
            --result-format ResourceIdOnly

      - name: Create deployment managed identity
        id: deploy
        shell: bash
        env:
          GITHUB_FEDERATED_SUBJECT: repo:HoldenJolley@323807497/Azure-Soltuion-Architect-Portfolio@1354100347:environment:prod
        run: |
          set -euo pipefail
          az deployment sub create \
            --name portfolio-identity-bootstrap \
            --location eastus2 \
            --template-file projects/resume/platform/infra/bootstrap/bootstrap-identity.bicep \
            --parameters githubSubject="$GITHUB_FEDERATED_SUBJECT" \
            --output none

          client_id="$(az deployment sub show --name portfolio-identity-bootstrap --query properties.outputs.clientId.value -o tsv)"
          principal_id="$(az deployment sub show --name portfolio-identity-bootstrap --query properties.outputs.principalId.value -o tsv)"
          identity_id="$(az deployment sub show --name portfolio-identity-bootstrap --query properties.outputs.identityResourceId.value -o tsv)"

          test -n "$client_id"
          test -n "$principal_id"
          test -n "$identity_id"

          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "principal_id=$principal_id" >> "$GITHUB_OUTPUT"
          echo "identity_id=$identity_id" >> "$GITHUB_OUTPUT"
          echo "::notice title=Portfolio deployment identity::Client ID: $client_id"

          {
            echo '## Portfolio deployment identity created'
            echo
            echo "- Client ID: \`$client_id\`"
            echo "- Principal ID: \`$principal_id\`"
            echo "- Resource ID: \`$identity_id\`"
            echo '- GitHub federation: `prod` environment'
            echo '- Azure role: `Contributor` at subscription scope'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify managed identity
        shell: bash
        run: |
          set -euo pipefail
          az identity show \
            --ids "${{ steps.deploy.outputs.identity_id }}" \
            --query '{name:name,clientId:clientId,principalId:principalId}' \
            --output jsonc
