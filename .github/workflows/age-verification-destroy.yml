name: age verification destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Enter DESTROY-AGE-dev to delete the temporary validation stacks'
        required: true
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: age-verification-live-validation-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm intentional destruction
        shell: pwsh
        run: |
          $expected = 'DESTROY-AGE-dev'
          if ('${{ inputs.confirm_destroy }}' -ne $expected) {
            throw "Destruction confirmation did not match '$expected'."
          }

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy temporary validation stacks
        shell: pwsh
        run: ./projects/age-verification/platform/scripts/destroy.ps1 -Environment dev -Force -EvidenceDirectory '_evidence/ageverify-dev-cleanup'

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ageverify-dev-cleanup-evidence
          path: _evidence/ageverify-dev-cleanup
          if-no-files-found: warn
          retention-days: 30
