name: e-commerce infrastructure

on:
  pull_request:
    paths:
      - 'projects/ecommerce/platform/infra/**'
      - 'projects/ecommerce/platform/scripts/**'
      - 'projects/ecommerce/platform/docs/**'
      - 'projects/ecommerce/platform/PROJECT-CHECKLIST.md'
      - 'projects/ecommerce/platform/README.md'
      - '.github/workflows/ecommerce-infra.yml'
      - '.github/workflows/ecommerce-destroy.yml'
      - '.github/workflows/ecommerce-expiry-cleanup.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to validate (live deployment is dev-only)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      deploy:
        description: Create/update the temporary dev Deployment Stack (Front Door omitted because this subscription blocks it)
        required: true
        default: false
        type: boolean
      ttl_hours:
        description: Automatic teardown TTL for a live dev validation deployment
        required: true
        default: '8'
        type: choice
        options:
          - '4'
          - '8'
          - '12'
      confirm_deploy:
        description: 'Required only for the dev live run. Enter DEPLOY-ECOMMERCE-dev'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse deployment scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            './projects/ecommerce/platform/scripts/validate.ps1',
            './projects/ecommerce/platform/scripts/deploy.ps1',
            './projects/ecommerce/platform/scripts/destroy.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $path"
            }
          }

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Deployment Stack CLI access
        run: az stack sub list --output none

      - name: Lint, build, and what-if
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/validate.ps1 -Environment ${{ inputs.environment || 'dev' }} -RunWhatIf

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.environment == 'dev'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: ecommerce-live-validation-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm intentional deployment
        shell: pwsh
        run: |
          $expected = 'DEPLOY-ECOMMERCE-dev'
          if ('${{ inputs.confirm_deploy }}' -ne $expected) {
            throw "Deployment confirmation did not match '$expected'."
          }

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Calculate validation expiry
        id: ttl
        shell: pwsh
        env:
          TTL_HOURS: ${{ inputs.ttl_hours }}
        run: |
          $ttlHours = [int]$env:TTL_HOURS
          $expiresAt = [DateTimeOffset]::UtcNow.AddHours($ttlHours).ToString('o')
          "expires_at=$expiresAt" >> $env:GITHUB_OUTPUT
          "VALIDATION_EXPIRES_AT_UTC=$expiresAt" >> $env:GITHUB_ENV
          Write-Host "Validation environment will expire at $expiresAt (TTL: $ttlHours hours)."

      - name: Deploy temporary validation stack
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/deploy.ps1 -Environment dev -EvidenceDirectory '_evidence/ecommerce-dev'

      - name: Stamp automatic teardown metadata
        if: always()
        shell: pwsh
        env:
          TTL_HOURS: ${{ inputs.ttl_hours }}
          EXPIRES_AT: ${{ steps.ttl.outputs.expires_at }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPIRES_AT)) {
            Write-Warning 'Expiry calculation did not complete, so no TTL metadata can be stamped.'
            exit 0
          }

          $resourceGroups = @(
            'rg-ecommerce-dev-global',
            'rg-ecommerce-dev-eus2'
          )

          $taggedGroups = @()
          foreach ($resourceGroup in $resourceGroups) {
            $exists = az group exists --name $resourceGroup
            if ($LASTEXITCODE -ne 0 -or $exists -ne 'true') {
              Write-Host "Resource group $resourceGroup does not exist; skipping TTL tag."
              continue
            }

            az group update `
              --name $resourceGroup `
              --set `
                "tags.validationEphemeral=true" `
                "tags.validationExpiresAtUtc=$env:EXPIRES_AT" `
                "tags.validationTtlHours=$env:TTL_HOURS" `
              --output none
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to stamp TTL metadata on $resourceGroup."
            }
            $taggedGroups += $resourceGroup
          }

          New-Item -ItemType Directory -Path '_evidence/ecommerce-dev' -Force | Out-Null
          [ordered]@{
            capturedUtc = [DateTimeOffset]::UtcNow.ToString('o')
            expiresAtUtc = $env:EXPIRES_AT
            ttlHours = [int]$env:TTL_HOURS
            taggedResourceGroups = $taggedGroups
            cleanupWorkflow = 'ecommerce validation expiry cleanup'
          } | ConvertTo-Json -Depth 10 | Set-Content '_evidence/ecommerce-dev/ttl.json' -Encoding utf8

          if ($taggedGroups.Count -eq 0) {
            Write-Warning 'No validation resource groups existed to receive TTL metadata.'
          } else {
            Write-Host "TTL metadata stamped on: $($taggedGroups -join ', ')"
          }

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecommerce-dev-deployment-evidence
          path: _evidence/ecommerce-dev
          if-no-files-found: warn
          retention-days: 30
