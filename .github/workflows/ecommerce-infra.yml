name: e-commerce infrastructure

on:
  pull_request:
    paths:
      - 'projects/ecommerce/platform/infra/**'
      - 'projects/ecommerce/platform/scripts/**'
      - '.github/workflows/ecommerce-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      deploy:
        description: Deploy after validation
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint, build, and what-if
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/validate.ps1 -Environment ${{ inputs.environment || 'dev' }} -RunWhatIf

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/deploy.ps1 -Environment ${{ inputs.environment }}
