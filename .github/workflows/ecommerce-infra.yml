name: e-commerce infrastructure

on:
  pull_request:
    paths:
      - 'projects/ecommerce/platform/infra/**'
      - 'projects/ecommerce/platform/scripts/**'
      - '.github/workflows/ecommerce-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      deploy:
        description: Deploy after validation
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: bicep-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Validate dev
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/validate.ps1 -Environment dev

      - name: Validate test
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/validate.ps1 -Environment test

      - name: Validate prod
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/validate.ps1 -Environment prod

  azure-what-if:
    name: azure-what-if
    needs: validate
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure OIDC configuration
        id: azure-config
        shell: bash
        run: |
          if [[ -n "$AZURE_CLIENT_ID_VALUE" && -n "$AZURE_TENANT_ID_VALUE" && -n "$AZURE_SUBSCRIPTION_ID_VALUE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Azure OIDC is not configured yet; skipping subscription what-if."
          fi

      - name: Azure login
        if: steps.azure-config.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if
        if: steps.azure-config.outputs.enabled == 'true'
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/validate.ps1 -Environment ${{ inputs.environment || 'dev' }} -RunWhatIf

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: [validate, azure-what-if]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        shell: pwsh
        run: ./projects/ecommerce/platform/scripts/deploy.ps1 -Environment ${{ inputs.environment }}
