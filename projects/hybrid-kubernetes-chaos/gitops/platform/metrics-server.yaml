apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: hybrid-gitops
  labels:
    app.kubernetes.io/part-of: hybrid-kubernetes-chaos
    app.kubernetes.io/component: observability
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: hybrid-gitops
  labels:
    app.kubernetes.io/part-of: hybrid-kubernetes-chaos
    app.kubernetes.io/component: observability
spec:
  interval: 30m
  timeout: 5m
  releaseName: metrics-server
  targetNamespace: kube-system
  storageNamespace: hybrid-gitops
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: hybrid-gitops
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicas: 1
    args:
      - --kubelet-insecure-tls
    commonLabels:
      app.kubernetes.io/part-of: hybrid-kubernetes-chaos
