apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-chaos-controller
  namespace: hybrid-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hybrid-chaos-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hybrid-chaos-controller
    spec:
      serviceAccountName: hybrid-chaos-controller
      containers:
        - name: controller
          image: python:3.13-alpine
          command: ["python", "-B", "/app/app.py"]
          env:
            - name: PORT
              value: "8080"
            - name: LAB_NAMESPACE
              value: hybrid-lab
            - name: LAB_DEPLOYMENT
              value: hybrid-demo
            - name: LAB_LABEL_SELECTOR
              value: app.kubernetes.io/name=hybrid-demo
            - name: CHAOS_LEASE_NAME
              value: hybrid-chaos-lock
            - name: CHAOS_COOLDOWN_SECONDS
              value: "90"
            - name: CHAOS_MAX_RECOVERY_SECONDS
              value: "45"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: hybrid-chaos-controller-code
            defaultMode: 0444
