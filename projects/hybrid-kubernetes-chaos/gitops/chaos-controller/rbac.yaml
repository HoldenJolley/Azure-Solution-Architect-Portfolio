apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybrid-chaos-controller
  namespace: hybrid-lab
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hybrid-chaos-controller
  namespace: hybrid-lab
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["hybrid-demo"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["hybrid-chaos-lock"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hybrid-chaos-controller
  namespace: hybrid-lab
subjects:
  - kind: ServiceAccount
    name: hybrid-chaos-controller
    namespace: hybrid-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hybrid-chaos-controller
