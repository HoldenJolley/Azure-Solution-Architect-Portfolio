apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hybrid-lab
resources:
  - rbac.yaml
  - lease.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: hybrid-chaos-controller-code
    files:
      - app.py
generatorOptions:
  disableNameSuffixHash: false
labels:
  - pairs:
      app.kubernetes.io/part-of: hybrid-kubernetes-chaos
    includeSelectors: false
