apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hybrid-lab
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - status-api
  - cloudflared.yaml
configMapGenerator:
  - name: hybrid-demo-content
    files:
      - ../demo/index.html
      - ../demo/live-status.js
generatorOptions:
  disableNameSuffixHash: false
labels:
  - pairs:
      app.kubernetes.io/managed-by: flux
    includeSelectors: false
