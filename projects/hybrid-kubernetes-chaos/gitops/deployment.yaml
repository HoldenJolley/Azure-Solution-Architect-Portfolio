apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-demo
  labels:
    app.kubernetes.io/name: hybrid-demo
    app.kubernetes.io/part-of: hybrid-kubernetes-chaos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hybrid-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hybrid-demo
        app.kubernetes.io/part-of: hybrid-kubernetes-chaos
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: hybrid-demo-content
